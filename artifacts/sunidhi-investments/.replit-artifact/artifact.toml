kind = "web"
previewPath = "/"
title = "Sunidhi Investments"
description = "A responsive investment advisory website for Sunidhi Investments, helping clients in Indore, Madhya Pradesh make smarter, more secure financial decisions."
version = "1.0.0"
id = "artifacts/sunidhi-investments"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19382

[services.development]
run = "pnpm --filter @workspace/sunidhi-investments run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sunidhi-investments", "run", "build" ]
serve = "static"
publicDir = "artifacts/sunidhi-investments/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19382"
BASE_PATH = "/"
